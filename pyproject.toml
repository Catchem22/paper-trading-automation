[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trading-automation"
version = "0.1.0"
description = "Paper-only Alpaca portfolio auditing and risk gates"
requires-python = ">=3.11"

[project.scripts]
paper-trading = "paper_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
